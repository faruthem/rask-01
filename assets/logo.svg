<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Gradiente cian táctico -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
    
    <!-- Filtro de resplandor para HUD -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ICONO EMBLEMA (Izquierda) -->
  <g transform="translate(10, 10)">
    <!-- Escudo exterior hexagonal -->
    <polygon points="50,2 95,25 95,75 50,98 5,75 5,25" 
             fill="#121824" stroke="url(#cyanGlow)" stroke-width="3" />

    <!-- Líneas de blindaje angular interno -->
    <polygon points="50,12 85,30 85,70 50,88 15,70 15,30" 
             fill="none" stroke="#1e293b" stroke-width="1.5" />

    <!-- Cabeza / Cúpula estricta RASK -->
    <path d="M 28 50 C 28 32, 72 32, 72 50 Z" 
          fill="#1b2434" stroke="url(#cyanGlow)" stroke-width="2" />
    
    <!-- Ranura / Sensor óptico principal del visor -->
    <rect x="36" y="44" width="28" height="4" rx="2" 
          fill="#00f0ff" filter="url(#glow)" />
    
    <!-- Orbes sensores auxiliares del domo -->
    <circle cx="38" cy="35" r="2.5" fill="#00f0ff" />
    <circle cx="50" cy="31" r="2.5" fill="#00f0ff" />
    <circle cx="62" cy="35" r="2.5" fill="#00f0ff" />

    <!-- Chasis torso inferior y orugas/patas articuladas esquemáticas -->
    <path d="M 34 56 L 66 56 L 62 76 L 38 76 Z" 
          fill="#0b0e14" stroke="#00f0ff" stroke-width="1.5" />
    <line x1="43" y1="62" x2="57" y2="62" stroke="#ff3344" stroke-width="2" />
  </g>

  <!-- TIPOGRAFÍA CORPORATIVA (Derecha) -->
  <g transform="translate(125, 20)">
    <!-- Nombre de la Empresa -->
    <text x="0" y="38" 
          font-family="'Orbitron', -apple-system, sans-serif" 
          font-size="34" 
          font-weight="900" 
          letter-spacing="4" 
          fill="#ffffff">
      KINETIC<tspan fill="#00f0ff">.</tspan>DYNAMICS
    </text>

    <!-- Subdivisión táctica -->
    <text x="2" y="60" 
          font-family="'Share Tech Mono', monospace" 
          font-size="13" 
          letter-spacing="5" 
          fill="#8b9bb4">
      AUTONOMOUS DEFENSE &amp; SECURITY SYSTEMS
    </text>

    <!-- Indicador de estado militar -->
    <line x1="2" y1="72" x2="350" y2="72" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="360" cy="72" r="3" fill="#00f0ff" filter="url(#glow)" />
    <text x="372" y="75" 
          font-family="'Share Tech Mono', monospace" 
          font-size="10" 
          letter-spacing="2" 
          fill="#00f0ff">
      DIV-01 SEC
    </text>
  </g>
</svg>
